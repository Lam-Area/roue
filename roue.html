<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine L'Ordre</title>
    <link rel="stylesheet" href="roue.css">
</head>
<body>
    <div class="dashboard" id="mainDashboard">
        <header class="header" id="dashHeader">
            <div class="logo-area">
                <span class="logo-icon"></span>
                <h1>Configuration Système</h1>
            </div>
            <button id="resetBtn" class="btn-reset">RÉINITIALISER TOUT</button>
        </header>

        <div class="main-content" id="mainContent">
            <div class="slot-machine" id="slotContainer">
                
                <!-- Vidéo avec opacité ajustée -->
                <video src="bg.mp4" autoplay loop muted playsinline class="slot-video-bg"></video>
                
                <!-- Images RM décoratives permanentes -->
                <img src="rm.png" class="rm-deco rm-left" alt="">
                <img src="rm.png" class="rm-deco rm-right" alt="">

                <div class="machine-content-wrapper">
                    <div class="machine-top">
                        <div class="jackpot-display">
                            <span class="pulse-text">GIVEAWAY</span><br>
                            <span class="sub-text">RM30100</span>
                        </div>
                    </div>

                    <div class="reels-glass">
                        <div class="reels-container">
                            <div class="reel"><div class="strip" id="strip1"></div></div>
                            <div class="reel"><div class="strip" id="strip2"></div></div>
                            <div class="reel"><div class="strip" id="strip3"></div></div>
                            <div class="win-line"></div>
                        </div>
                    </div>

                    <div class="legal-paytable">
                        <div class="pay-col">
                            <img src="lose.gif" class="shape-mini" alt="">
                            <span class="lbl">PERDU</span>
                            <span class="pct">78.3%</span>
                        </div>
                        <div class="pay-col">
                            <img src="relaunch.gif" class="shape-mini" alt="">
                            <span class="lbl">RELANCE</span>
                            <span class="pct">20.0%</span>
                        </div>
                        <div class="pay-col">
                            <img src="win.gif" class="shape-mini" alt="">
                            <span class="lbl">AION 2</span>
                            <span class="pct">1.7%</span>
                        </div>
                    </div>

                    <div class="machine-bottom">
                        <button id="spinBtn" class="spin-trigger">
                            <div class="spin-inner">SPIN</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="particles.js"></script>
    <script src="roue.js"></script>
</body>
</html>
